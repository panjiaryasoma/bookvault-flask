<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BookVault{% endblock %}</title>

    <script>
        (() => {
            const savedTheme = localStorage.getItem("bookvault-theme");
            const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            document.documentElement.dataset.theme = savedTheme || (prefersDark ? "dark" : "light");
        })();
    </script>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    {% block styles %}{% endblock %}
</head>

<body>
    <a class="skip-link" href="#main-content">Lewati ke konten utama</a>

    {% block header %}{% endblock %}

    <main id="main-content" class="{% block main_class %}container{% endblock %}">
        {% block flash_messages %}
        {% include "flash_messages.html" %}
        {% endblock %}

        {% block content %}{% endblock %}
    </main>

    <button
        type="button"
        class="theme-toggle"
        id="theme-toggle"
        aria-label="Aktifkan dark mode"
        aria-pressed="false"
        title="Ganti tema"
    >
        <span class="theme-toggle__track" aria-hidden="true">
            <span class="theme-toggle__knob"></span>
            <span class="theme-toggle__icon theme-toggle__icon--sun">
                <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                    <circle cx="12" cy="12" r="3.5"></circle>
                    <path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"></path>
                </svg>
            </span>
            <span class="theme-toggle__icon theme-toggle__icon--moon">
                <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                    <path d="M20 15.2A8.2 8.2 0 0 1 8.8 4a8.2 8.2 0 1 0 11.2 11.2Z"></path>
                </svg>
            </span>
            <span class="theme-toggle__highlight"></span>
        </span>
        <span class="sr-only" id="theme-toggle-label">Dark mode</span>
    </button>

    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
