name: BookVault verification
on:
  push:
    branches: [feature/smart-library]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app.py library_metadata.py library_routes.py scripts tests
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r requirements.txt
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bookvault_test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: bookvault_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bookvault_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://bookvault_test:test-only@localhost:5432/bookvault_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  browser-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm run build
      - name: Export resolved dependency lock for review
        run: node -e "console.log('LOCKFILE_BEGIN'+require('fs').readFileSync('package-lock.json').toString('base64')+'LOCKFILE_END')"
      - run: node --check static/js/scanner.js && node --check static/js/csrf.js
      - run: npm audit --audit-level=high

  chromium-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt playwright==1.55.0
      - run: npm install --ignore-scripts && npm run build
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_e2e.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: bookvault-browser-screenshots
          path: test-artifacts/
