name: Smart Library CI
on:
  push:
    branches: ["feature/smart-library-v2"]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bookvault
          POSTGRES_PASSWORD: bookvault_test
          POSTGRES_DB: bookvault
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U bookvault" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      BOOKVAULT_SECRET_KEY: ci-test-secret-not-for-production-1234567890
      BOOKVAULT_API_KEY: ci-test-api-not-for-production-1234567890
      BOOKVAULT_HTTPS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest==8.3.5
      - run: python -m compileall -q app.py library.py
      - if: matrix.db == 'postgres'
        run: echo 'DATABASE_URL=postgresql+psycopg://bookvault:bookvault_test@localhost:5432/bookvault' >> "$GITHUB_ENV"
      - run: python -m pytest -q
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: node --check static/js/scanner.js && node --check static/js/csrf.js
      - run: test -s static/vendor/lang/eng.traineddata.gz && test -s static/vendor/lang/ind.traineddata.gz && test -s static/vendor/zxing-browser.min.js
