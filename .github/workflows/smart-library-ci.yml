name: Smart Library CI
on:
  push:
    branches: ["feature/smart-library-v2"]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bookvault
          POSTGRES_PASSWORD: bookvault_test
          POSTGRES_DB: bookvault
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U bookvault" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      BOOKVAULT_SECRET_KEY: ci-test-secret-not-for-production-1234567890
      BOOKVAULT_API_KEY: ci-test-api-not-for-production-1234567890
      BOOKVAULT_HTTPS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest==8.3.5
      - run: python -m compileall -q app.py library.py
      - if: matrix.db == 'postgres'
        run: |
          PGPASSWORD=bookvault_test psql -h localhost -U bookvault -d bookvault -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE bookvault_runtime LOGIN PASSWORD 'runtime_test' NOSUPERUSER NOCREATEDB NOCREATEROLE;
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE SCHEMA bookvault_private AUTHORIZATION bookvault_runtime;
          REVOKE ALL ON SCHEMA bookvault_private FROM PUBLIC, anon, authenticated;
          ALTER DEFAULT PRIVILEGES FOR ROLE bookvault_runtime IN SCHEMA bookvault_private REVOKE ALL ON TABLES FROM PUBLIC, anon, authenticated;
          SQL
          echo 'DATABASE_URL=postgresql+psycopg://bookvault_runtime:runtime_test@localhost:5432/bookvault' >> "$GITHUB_ENV"
          echo 'BOOKVAULT_DB_SCHEMA=bookvault_private' >> "$GITHUB_ENV"
      - run: python -m pytest -q
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: node --check static/js/scanner.js && node --check static/js/csrf.js
      - run: test -s static/vendor/lang/eng.traineddata.gz && test -s static/vendor/lang/ind.traineddata.gz && test -s static/vendor/zxing-browser.min.js

  browser:
    runs-on: ubuntu-latest
    env:
      BOOKVAULT_SECRET_KEY: ci-browser-secret-not-for-production-1234567890
      BOOKVAULT_API_KEY: ci-browser-api-not-for-production-1234567890
      BOOKVAULT_HTTPS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt playwright==1.65.2
      - run: npm install --ignore-scripts --no-audit --no-fund && npm run build
      - run: python -m playwright install --with-deps chromium
      - run: flask --app app init-db
      - run: |
          gunicorn --workers 1 --bind 127.0.0.1:8000 app:app > /tmp/bookvault.log 2>&1 &
          python tests/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            browser-evidence/
            /tmp/bookvault.log
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install pip-audit==2.9.0
      - run: pip-audit --strict -r requirements.txt
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=moderate
